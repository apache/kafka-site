    (function () {
        // 1. Get version from Hugo config or Current Section
        var targetVersion = "{{ if ne .Page.Section "documentation" }}{{ .Page.Section }}{{ else }}{{ .Site.Params.latest_version }}{{ end }}";

        // 2. Define the Mapping
        var hashIncludedMap = {
            //Getting Started menu
            "#gettingStarted": "getting-started",

            "#zk2kraft-summary": "getting-started/zk2kraft",

            //APIs menu
            "#api": "apis",
            "#producerapi": "apis/#producer-api",
            "#consumerapi": "apis/#consumer-api",
            "#shareconsumerapi": "apis/#share-consumer-api",
            "#streamsapi": "apis/#streams-api",
            "#connectapi": "apis/#connect-api",
            "#adminapi": "apis/#admin-api",

            //Configuration menu
            "#configuration": "configuration",
            "#brokerconfigs": "configuration/broker-configs/",

            "#sourceconnectconfigs": "configuration/kafka-connect-configs/#source-connector-configs",
            "#sinkconnectconfigs": "configuration/kafka-connect-configs/#sink-connector-configs",
            "#streamsconfigs": "configuration/kafka-streams-configs/",
            "#adminclientconfigs": "configuration/admin-configs/",
            "#mirrormakerconfigs": "configuration/mirrormaker-configs/",
            "#systemproperties": "configuration/system-properties/",
            "#tieredstorageconfigs": "configuration/tiered-storage-configs/",
            "#config_providers": "configuration/configuration-providers/",

            //Design menu
            "#design": "design/design/",
            "#majordesignelements": "design/design/#motivation",
            "#persistence": "design/design/#persistence",
            "#maximizingefficiency": "design/design/#efficiency",
            "#theproducer": "design/design/#the-producer",
            "#theconsumer": "design/design/#the-consumer",
            "#semantics": "design/design/#message-delivery-semantics",
            "#usingtransactions": "design/design/#using-transactions",
            "#sharegroups": "design/design/#share-groups",
            "#replication": "design/design/#replication",
            "#compaction": "design/design/#log-compaction",
            "#design_quotas": "design/design/#quotas",

            //Implementation menu
            "#implementation": "implementation",
            "#networklayer": "implementation/network-layer/",
            "#messages": "implementation/messages/",
            "#messageformat": "implementation/message-format/",
            "#log": "implementation/log/",
            "#distributionimpl": "implementation/distribution/",
            "#recordbatch": "implementation/message-format/#record-batch",

            //Operations menu
            "#operations": "operations",
            "#basic_ops": "operations/basic-kafka-operations/",
            "#datacenters": "operations/datacenters/",
            "#georeplication": "operations/geo-replication-cross-cluster-data-mirroring/",
            "#multitenancy": "operations/multi-tenancy/",
            "#java": "operations/java-version/",
            "#hwandos": "operations/hardware-and-os/",

            //Security menu
            "#security": "security",
            "#security_overview": "security/security-overview/",
            "#listener_configuration": "security/listener-configuration/",
            "#security_ssl": "security/encryption-and-authentication-using-ssl/",
            "#security_sasl": "security/authentication-using-sasl/",
            "#security_authz": "security/authorization-and-acls/",
            "#security_rolling_upgrade": "security/incorporating-security-features-in-a-running-cluster/",

            //Connect menu
            "#connect": "kafka-connect",
            "#connect_overview": "kafka-connect/overview/",
            "#connect_user": "kafka-connect/user-guide/",
            "#connect_development": "kafka-connect/connector-development-guide/",
            "#connect_administration": "kafka-connect/administration/",

            //Streams menu
            "#streams": "streams"

        };

        var currentHash = window.location.hash;

        // 3. Logic:
        // IF hash matches map -> Go to Deep Link
        // ELSE -> Go to legitimate Docs Homepage 

        if (currentHash && hashIncludedMap[currentHash]) {
            window.location.replace("/" + targetVersion + "/" + hashIncludedMap[currentHash]);
        } else {
            // Check for deep link redirects
            var currentPath = window.location.pathname;
            if (currentPath.includes("/documentation/streams/")) {
                // remove "/documentation" from the path
                // e.g. /37/documentation/streams/foo -> /37/streams/foo
                // e.g. /documentation/streams/foo -> /streams/foo (but creates issue if no version prefix)

                // If we are in a versioned section (targetVersion is like "37"), 
                // the path is likely /37/documentation/streams/...
                // modifying standard logic: replace "/documentation/" with "/"

                var newPath = currentPath.replace("/documentation/", "/");

                // If targetVersion is actually the latest version (because we are in global /documentation),
                // currentPath is /documentation/streams/...
                // newPath becomes /streams/... which might not be valid if we need /41/streams/... or if /streams/... is a valid alias?
                // Actually /streams/ redirects to latest usually? checking hugo config... 
                // Hugo config has streams in menu url: "/documentation/streams"

                // Wait, if I am at /documentation/streams/foo, I want to go to /41/streams/foo (if 41 is latest).
                // existing logic: targetVersion is 41 (latest).
                // currentPath: /documentation/streams/foo
                // replace: /streams/foo
                // BUT /streams/foo might not be the canonical path, usually it is /{version}/streams/foo.
                // Let's prepend version if it is missing?

                if (targetVersion === "{{ .Site.Params.latest_version }}" && !currentPath.match(/^\/\d+/)) {
                    // We are at root /documentation/streams...
                    // We want /41/streams...
                    newPath = "/" + targetVersion + newPath;
                }

                window.location.replace(newPath + currentHash);
                return;
            }

            // Default Fallback 
            window.location.replace("/" + targetVersion + "/getting-started/introduction");
        }
    })();
</script>
